# Temporary fork-only test: remove before opening an upstream PR.
name: macOS onedir launch candidate

on:
  push:
    branches:
      - fix/macos-onedir-startup-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native emulator core
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller Pillow
      - name: Run upstream tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Package app
        run: pyinstaller --noconfirm --clean NgpCraftEmulator.spec
      - name: Check native macOS bundle
        shell: bash
        run: |
          app='dist/NgpCraftEmulator.app'
          test -x "$app/Contents/MacOS/NgpCraftEmulator"
          test -d "$app/Contents/Frameworks"
          test -e "$app/Contents/Resources/hle_bios/bios_hle.bin"
          echo "Runner architecture: $(uname -m)"
          echo "Packaged executable: $(file "$app/Contents/MacOS/NgpCraftEmulator")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist"
          du -sh "$app"
      - name: Archive for local startup timing test
        run: ditto -c -k --keepParent dist/NgpCraftEmulator.app NgpCraftEmulator-macos-onedir-preview.zip
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: NgpCraftEmulator-macos-onedir-preview
          path: NgpCraftEmulator-macos-onedir-preview.zip
          if-no-files-found: error
